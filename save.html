    <main class="container">
        <!-- 供读屏器与搜索引擎识别页面主标题；视觉标题由下方模块承担。 -->
        <h1 class="dm-visually-hidden">存档管理</h1>
        <div class="inner">
            <section class="mod-dm mod-dm-save">
                <div class="hd">
                    <h3 class="title">存档</h3>
                    <p class="subtitle">Saves</p>
                </div>
                <div class="bd">
                    <div id="dm-notice"></div>
                    <!-- 当前进度卡片：读取游戏页写入的检查点，可保存为手动档。 -->
                    <div id="dm-progress"></div>
                    <div class="dm-section-title">手动存档 <span class="sub" id="dm-manual-count"></span></div>
                    <!-- 手动档：玩家命名、可覆盖、可导出，最多 20 份。 -->
                    <div id="dm-manual"></div>
                    <div class="dm-section-title">自动存档 <span class="sub">通关或离开页面时自动保留最近 3 份</span></div>
                    <!-- 自动档：系统滚动维护，不提供覆盖按钮。 -->
                    <div id="dm-auto"></div>
                    <div class="dm-toolbar" id="dm-toolbar">
                        <button type="button" class="dm-btn dm-btn-ghost" id="dm-export">导出全部存档</button>
                        <div class="tip">卡片内「导出」只导出该份存档；底部按钮导出全部有效存档。文件可在其他浏览器/设备迁入，导入入口位于<a href="./load.html">读档页</a>。</div>
                    </div>
                </div>
            </section>
        </div>
    </main>
